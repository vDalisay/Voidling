name: Godot C# CI

on:
  push:
    branches:
      - main
      - feature/demo-mvp
      - architecture/futureproof-foundation
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: true

      - name: Restore game
        run: dotnet restore Voidling.csproj

      - name: Restore tests
        run: dotnet restore Tests/Voidling.Tests.csproj

      - name: Build release
        run: dotnet build Voidling.csproj --configuration Release --no-restore

      - name: Enforce architecture boundaries
        shell: bash
        run: |
          for layer in Scripts/Domain Scripts/Application; do
            if grep -R -n -E 'using[[:space:]]+Godot|Godot\.' "$layer" --include='*.cs'; then
              echo "$layer must remain free of Godot dependencies."
              exit 1
            fi
          done

          if grep -R -n -E 'GameSession\.Instance' Scripts/Domain Scripts/Application --include='*.cs'; then
            echo 'Domain/Application must not use the GameSession service locator.'
            exit 1
          fi

          if grep -R -n -E 'GameSession\.Instance|GameRules\.' Scripts/Presentation --include='*.cs'; then
            echo 'Standalone Presentation components must receive view state and emit intent; do not reach through legacy GameSession/GameRules facades.'
            exit 1
          fi

          if grep -n -E 'GameSession\.Instance' Scripts/UI/MainController*.cs; then
            echo 'MainController has migrated away from the static GameSession locator; keep its session dependency explicit.'
            exit 1
          fi

      - name: Domain and application tests
        run: dotnet test Tests/Voidling.Tests.csproj --configuration Release --no-restore

      # Godot's editor-side C# integration loads the Debug assembly. Build it before the
      # import pass so custom Resources/autoloads can be resolved on a completely clean clone.
      - name: Build debug for Godot editor
        run: dotnet build Voidling.csproj --configuration Debug --no-restore

      # --import waits until asset imports finish. This is required for CSV translations and
      # other source assets; --quit-after is frame-based and previously let CI exit mid-scan.
      - name: Import Godot resources
        run: godot --headless --path . --import

      - name: Verify localization import
        shell: bash
        run: |
          if [ ! -f Localization/strings.en.translation ]; then
            echo 'Godot did not generate Localization/strings.en.translation from strings.csv.'
            exit 1
          fi

      # Start the actual main scene after imports. Godot can return zero for some editor scan
      # errors, so inspect the runtime log as well as the process exit code.
      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --quit-after 30 2>&1 | tee godot-runtime.log
          if grep -E '^(ERROR|SCRIPT ERROR):' godot-runtime.log; then
            echo 'Godot runtime emitted an error.'
            exit 1
          fi
