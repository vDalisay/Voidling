name: Godot C# CI

on:
  push:
    branches:
      - main
      - feature/demo-mvp
      - architecture/futureproof-foundation
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: true

      - name: Restore game
        run: dotnet restore Voidling.csproj

      - name: Restore tests
        run: dotnet restore Tests/Voidling.Tests.csproj

      - name: Build
        run: dotnet build Voidling.csproj --configuration Release --no-restore

      - name: Enforce inward architecture boundaries
        shell: bash
        run: |
          for layer in Scripts/Domain Scripts/Application; do
            if grep -R -n -E 'using[[:space:]]+Godot|Godot\.' "$layer" --include='*.cs'; then
              echo "$layer must remain free of Godot dependencies."
              exit 1
            fi
          done

          if grep -R -n -E 'GameSession\.Instance' Scripts/Domain Scripts/Application --include='*.cs'; then
            echo 'Domain/Application must not use the GameSession service locator.'
            exit 1
          fi

      - name: Domain and application tests
        run: dotnet test Tests/Voidling.Tests.csproj --configuration Release --no-restore

      - name: Parse project and scenes
        run: godot --headless --path . --editor --quit-after 12
