name: Godot C# CI

on:
  push:
    branches:
      - main
      - feature/demo-mvp
      - architecture/futureproof-foundation
      - agent/contextualized-implementation-plan
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: true

      - name: Restore game
        run: dotnet restore Voidling.csproj

      - name: Restore tests
        run: dotnet restore Tests/Voidling.Tests.csproj

      - name: Build release
        run: dotnet build Voidling.csproj --configuration Release --no-restore

      - name: Enforce architecture boundaries
        shell: bash
        run: |
          for layer in Scripts/Domain Scripts/Application; do
            if grep -R -n -E 'using[[:space:]]+Godot|Godot\.' "$layer" --include='*.cs'; then
              echo "$layer must remain free of Godot dependencies."
              exit 1
            fi
          done

          if grep -R -n -E 'GameRules\.' Scripts/Presentation --include='*.cs'; then
            echo 'Standalone Presentation components must receive view state and emit intent; do not reach through the legacy GameRules facade.'
            exit 1
          fi

          if grep -R -n -E 'GameSession\.Instance' Scripts --include='*.cs'; then
            echo 'GameSession.Instance is forbidden. Resolve or pass explicit session/use-case dependencies instead of reintroducing a service locator.'
            exit 1
          fi

          # Base Voidling artwork is authored once in DefaultVoidlingVisual.tres. Garden, remote
          # Garden, race and portrait code must consume VoidlingVisualFactory instead of loading
          # those atlases directly and silently creating another visual source of truth.
          if grep -R -n -F 'Basic Charakter Spritesheet.png' Scripts --include='*.cs'; then
            echo 'Base Voidling atlas paths are forbidden in C# consumers. Configure DefaultVoidlingVisual.tres and use VoidlingVisualFactory.'
            exit 1
          fi

          if grep -R -n -F 'Early Access/Ocean Pack/swimming.png' Scripts --include='*.cs'; then
            echo 'Voidling swim atlas paths are forbidden in C# consumers. Configure DefaultVoidlingVisual.tres and use VoidlingVisualFactory.'
            exit 1
          fi

          test -f Resources/Presentation/Voidlings/DefaultVoidlingVisual.tres

      - name: Domain and application tests
        run: dotnet test Tests/Voidling.Tests.csproj --configuration Release --no-restore

      # Godot's editor-side C# integration loads the Debug assembly. Build it before the
      # import pass so custom Resources/autoloads can be resolved on a completely clean clone.
      - name: Build debug for Godot editor
        run: dotnet build Voidling.csproj --configuration Debug --no-restore

      # --import waits until source assets are imported. --quit-after is frame-based and can
      # let CI exit mid-scan, so keep this blocking pass even though localization is now a
      # directly loadable committed gettext file rather than a generated CSV artifact.
      - name: Import Godot resources
        run: godot --headless --path . --import

      - name: Verify localization source
        shell: bash
        run: |
          test -f Localization/en.po
          grep -q 'res://Localization/en.po' project.godot
          if grep -q 'strings\.en\.translation' project.godot; then
            echo 'project.godot must not reference a generated translation artifact.'
            exit 1
          fi

      # Start the actual main scene after imports. Godot can return zero for some editor scan
      # errors, so inspect the runtime log as well as the process exit code.
      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . --quit-after 30 2>&1 | tee godot-runtime.log
          if grep -E '^(ERROR|SCRIPT ERROR):' godot-runtime.log; then
            echo 'Godot runtime emitted an error.'
            exit 1
          fi

      - name: Garden UI interaction and layout smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . -- --voidling-garden-ui-smoke --voidling-dev-profile=ci_garden_ui 2>&1 | tee garden-ui-smoke.log
          grep -q 'GARDEN_UI_SMOKE_SUCCESS' garden-ui-smoke.log
          if grep -E '^(ERROR|SCRIPT ERROR):' garden-ui-smoke.log; then
            exit 1
          fi

      # Every cataloged Voidling body family must resolve world/race/portrait output through the
      # production factory, so an art change cannot silently break a creature surface.
      - name: Voidling visual smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . -- --voidling-visual-smoke 2>&1 | tee voidling-visual-smoke.log
          if ! grep -q 'VOIDLING_VISUAL_SMOKE_SUCCESS' voidling-visual-smoke.log; then
            echo 'Voidling visual contract failed.'
            exit 1
          fi
          if grep -E '^(ERROR|SCRIPT ERROR):' voidling-visual-smoke.log; then
            echo 'Voidling visual smoke emitted a Godot error.'
            exit 1
          fi

      # Race presentation regressions that only surface once Godot is running: authored segment
      # kinds that draw nothing (Climb rendered as bare ground), HUD labels that fall through to the
      # wrong section, course strings that were never authored and showed raw keys to players, and
      # a race sprite pivot that drifts off the shared shadow so creatures float above their shadow.
      - name: Race presentation smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . -- --voidling-race-presentation-smoke 2>&1 | tee race-presentation-smoke.log
          if ! grep -q 'RACE_PRESENTATION_SMOKE_SUCCESS' race-presentation-smoke.log; then
            echo 'Race presentation contract failed.'
            exit 1
          fi
          if grep -E '^(ERROR|SCRIPT ERROR):' race-presentation-smoke.log; then
            echo 'Race presentation smoke emitted a Godot error.'
            exit 1
          fi

      # Race a real RaceScreen to the finish line and require a results screen with a working way
      # back. Guards the freeze where the simulation completed but the podium never rendered, which
      # left the player stuck on a motionless track.
      - name: Race completion smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . -- --voidling-race-completion-smoke 2>&1 | tee race-completion-smoke.log
          if ! grep -q 'RACE_COMPLETION_SMOKE_SUCCESS' race-completion-smoke.log; then
            echo 'Race never reached a usable results screen.'
            exit 1
          fi
          if grep -E '^(ERROR|SCRIPT ERROR):' race-completion-smoke.log; then
            echo 'Race completion smoke emitted a Godot error.'
            exit 1
          fi

      # Family tree viewport geometry: how far the lineage may be zoomed out, that content smaller
      # than the viewport centres instead of pinning to a corner, and that the inheritance-flow
      # pulses sample points along the drawn connection rather than drifting off it.
      - name: Family tree smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . -- --voidling-family-tree-smoke 2>&1 | tee family-tree-smoke.log
          if ! grep -q 'FAMILY_TREE_SMOKE_SUCCESS' family-tree-smoke.log; then
            echo 'Family tree viewport contract failed.'
            exit 1
          fi
          if grep -E '^(ERROR|SCRIPT ERROR):' family-tree-smoke.log; then
            echo 'Family tree smoke emitted a Godot error.'
            exit 1
          fi

      # Exercise the actual user:// repository. Two successful saves establish a backup, then the
      # probe corrupts the primary and must recover/heal from the previous backup without copying
      # the corrupt primary over it.
      - name: Persistence recovery smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . -- --voidling-persistence-recovery-smoke 2>&1 | tee persistence-recovery-smoke.log
          if ! grep -q 'PERSISTENCE_RECOVERY_SMOKE_SUCCESS' persistence-recovery-smoke.log; then
            echo 'Persistence repository did not recover and heal the backup as expected.'
            exit 1
          fi
          if grep -E '^(ERROR|SCRIPT ERROR):' persistence-recovery-smoke.log; then
            echo 'Persistence recovery smoke emitted a Godot error.'
            exit 1
          fi

      # Exercise the actual player-facing trade room controls. This regression gate is intentionally
      # presentation-only: it toggles a real Voidling card and presses the real Accept/Cancel buttons,
      # proving the panel emits the selected asset ID instead of merely appearing selected visually.
      - name: Trade panel interaction smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s godot --headless --path . -- --voidling-trade-panel-smoke 2>&1 | tee trade-panel-smoke.log
          if ! grep -q 'TRADE_PANEL_SMOKE_SUCCESS' trade-panel-smoke.log; then
            echo 'Trade panel did not emit the expected selection/accept/cancel intents.'
            exit 1
          fi
          if grep -E '^(ERROR|SCRIPT ERROR):' trade-panel-smoke.log; then
            echo 'Trade panel smoke emitted a Godot error.'
            exit 1
          fi

      # Exercise the real development ENet adapter with two independent game processes. Both
      # processes must form one LAN lobby and exchange the same typed Application Hello packet
      # used by Steam before the command-line probe exits successfully.
      - name: LAN multiplayer two-process smoke test
        shell: bash
        run: |
          set -u
          rm -f lan-host.log lan-client.log
          host_pid=''

          cleanup() {
            if [ -n "$host_pid" ] && kill -0 "$host_pid" 2>/dev/null; then
              kill "$host_pid" 2>/dev/null || true
              wait "$host_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          timeout 20s godot --headless --path . -- \
            --voidling-lan-host \
            --voidling-lan-name=CIHost \
            --voidling-dev-profile=ci_host \
            --voidling-lan-smoke >lan-host.log 2>&1 &
          host_pid=$!

          sleep 1
          set +e
          timeout 20s godot --headless --path . -- \
            --voidling-lan-join=127.0.0.1 \
            --voidling-lan-name=CIClient \
            --voidling-dev-profile=ci_client \
            --voidling-lan-smoke >lan-client.log 2>&1
          client_code=$?

          wait "$host_pid"
          host_code=$?
          set -e
          host_pid=''

          echo '--- LAN host log ---'
          cat lan-host.log || true
          echo '--- LAN client log ---'
          cat lan-client.log || true
          echo "LAN smoke process exit codes: host=$host_code client=$client_code"

          if [ "$host_code" -ne 0 ] || [ "$client_code" -ne 0 ]; then
            echo 'LAN smoke process failed.'
            exit 1
          fi

          if ! grep -q 'LAN_SMOKE_SUCCESS' lan-host.log; then
            echo 'LAN host never completed the typed Hello handshake.'
            exit 1
          fi
          if ! grep -q 'LAN_SMOKE_SUCCESS' lan-client.log; then
            echo 'LAN client never completed the typed Hello handshake.'
            exit 1
          fi

      # Run the actual Pokemon-style trade interaction over the same ENet adapter. The probe uses
      # TradePresentationBridge just like the UI: invite -> accept invite -> choose one Voidling each
      # -> both Accept -> durable two-phase commit. Both processes must observe the expected local
      # outgoing/incoming IDs before they exit successfully.
      - name: LAN multiplayer trade two-process smoke test
        shell: bash
        run: |
          set -u
          rm -f lan-trade-host.log lan-trade-client.log
          host_pid=''

          cleanup_trade() {
            if [ -n "$host_pid" ] && kill -0 "$host_pid" 2>/dev/null; then
              kill "$host_pid" 2>/dev/null || true
              wait "$host_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_trade EXIT

          timeout 35s godot --headless --path . -- \
            --voidling-lan-host \
            --voidling-lan-port=27182 \
            --voidling-lan-name=CITradeHost \
            --voidling-dev-profile=ci_trade_host \
            --voidling-lan-trade-smoke >lan-trade-host.log 2>&1 &
          host_pid=$!

          sleep 1
          set +e
          timeout 35s godot --headless --path . -- \
            --voidling-lan-join=127.0.0.1 \
            --voidling-lan-port=27182 \
            --voidling-lan-name=CITradeClient \
            --voidling-dev-profile=ci_trade_client \
            --voidling-lan-trade-smoke >lan-trade-client.log 2>&1
          client_code=$?

          wait "$host_pid"
          host_code=$?
          set -e
          host_pid=''

          echo '--- LAN trade host diagnostic ---'
          grep -E '\[trade-lan-smoke\]|trade negotiation|multiplayer trade|ERROR|SCRIPT ERROR|WARNING' lan-trade-host.log || true
          echo '--- LAN trade client diagnostic ---'
          grep -E '\[trade-lan-smoke\]|trade negotiation|multiplayer trade|ERROR|SCRIPT ERROR|WARNING' lan-trade-client.log || true
          echo "LAN trade process exit codes: host=$host_code client=$client_code"

          if [ "$host_code" -ne 0 ] || [ "$client_code" -ne 0 ]; then
            echo 'LAN trade smoke process failed.'
            exit 1
          fi

          if ! grep -q 'LAN_TRADE_SMOKE_SUCCESS' lan-trade-host.log; then
            echo 'LAN trade host never completed the negotiated durable exchange.'
            exit 1
          fi
          if ! grep -q 'LAN_TRADE_SMOKE_SUCCESS' lan-trade-client.log; then
            echo 'LAN trade client never completed the negotiated durable exchange.'
            exit 1
          fi

      - name: Upload LAN trade smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-trade-smoke-logs
          path: |
            lan-trade-host.log
            lan-trade-client.log
          if-no-files-found: ignore
